<script>
    const STORAGE_KEY = 'dvs_immunoassay_inventory_v3';
    const CLOUD_CFG_KEY = 'dvs_immunoassay_cloud_cfg_v1';
    const todayStr = new Date().toISOString().split('T')[0];
    const currentMonthStr = todayStr.slice(0, 7);

    let cloudDb = null;
    let cloudAuth = null;
    let cloudUnsubscribe = null;
    let isCloudApplyingRemote = false;
    let currentCloudUser = null;
// ... existing code ...
    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        } catch (err) {
            showToast('Amaran: Gagal menyimpan ke memori pelayar.', 'error');
        }
        pushStateToCloud();
    }

    // CLOUD ONLINE SYNC ENGINE (FIREBASE)
    function initCloudEngine() {
        const rawCfg = localStorage.getItem(CLOUD_CFG_KEY);
        const loginBtn = document.getElementById('cloudLoginBtn');
        const statusText = document.getElementById('connectionStatusText');
        const statusDot = document.getElementById('connectionStatusDot');

        if (!rawCfg || typeof firebase === 'undefined') {
            if (loginBtn) loginBtn.style.display = 'none';
            if (statusText) statusText.textContent = 'Mod Offline (Lokal)';
            if (statusDot) statusDot.style.background = '#4ade80';
            return;
        }

        try {
            const parsed = JSON.parse(rawCfg);
            if (!firebase.apps.length) {
                firebase.initializeApp(parsed.config);
            }
            cloudAuth = firebase.auth();
            cloudDb = firebase.firestore();
            if (loginBtn) loginBtn.style.display = 'inline-flex';

            cloudAuth.onAuthStateChanged(user => {
                currentCloudUser = user;
                const infoBox = document.getElementById('cloudLoggedInInfo');
                const authForm = document.getElementById('cloudAuthForm');
                const btnText = document.getElementById('cloudLoginBtnText');

                if (user) {
                    if (statusText) statusText.textContent = 'Online Cloud Aktif';
                    if (statusDot) statusDot.style.background = '#38bdf8';
                    if (btnText) btnText.textContent = user.email.split('@')[0];
                    if (infoBox) {
                        infoBox.style.display = 'block';
                        document.getElementById('cloudUserEmailDisplay').textContent = user.email;
                    }
                    if (authForm) authForm.style.display = 'none';
                    subscribeCloudWorkspace(parsed.workspaceId || 'dvs-immunoassay-main');
                } else {
                    if (statusText) statusText.textContent = 'Online (Sila Log Masuk)';
                    if (statusDot) statusDot.style.background = '#fbbf24';
                    if (btnText) btnText.textContent = 'Log Masuk Cloud';
                    if (infoBox) infoBox.style.display = 'none';
                    if (authForm) authForm.style.display = 'block';
                    if (cloudUnsubscribe) { cloudUnsubscribe(); cloudUnsubscribe = null; }
                }
            });
        } catch (err) {
            console.error('Cloud init error:', err);
            showToast('Ralat konfigurasi Cloud. Sila semak tetapan di tab Admin.', 'error');
        }
    }

    function subscribeCloudWorkspace(workspaceId) {
        if (!cloudDb) return;
        if (cloudUnsubscribe) cloudUnsubscribe();

        const docRef = cloudDb.collection('dvs_inventori_workspaces').doc(workspaceId);
        cloudUnsubscribe = docRef.onSnapshot(snap => {
            if (snap.exists) {
                const remoteData = snap.data();
                if (remoteData && remoteData.stateJson) {
                    isCloudApplyingRemote = true;
                    try {
                        const imported = JSON.parse(remoteData.stateJson);
                        appState = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), imported);
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                        refreshAllViews();
                    } finally {
                        isCloudApplyingRemote = false;
                    }
                }
            } else {
                pushStateToCloud();
            }
        }, err => {
            showToast('Amaran penyegerakan Cloud: ' + err.message, 'error');
        });
    }

    function pushStateToCloud() {
        if (isCloudApplyingRemote || !cloudDb || !currentCloudUser) return;
        const rawCfg = localStorage.getItem(CLOUD_CFG_KEY);
        if (!rawCfg) return;
        try {
            const parsed = JSON.parse(rawCfg);
            const workspaceId = parsed.workspaceId || 'dvs-immunoassay-main';
            cloudDb.collection('dvs_inventori_workspaces').doc(workspaceId).set({
                stateJson: JSON.stringify(appState),
                updatedAt: new Date().toISOString(),
                updatedBy: currentCloudUser.email
            });
        } catch (err) {
            console.error('Push cloud error:', err);
        }
    }

    function openCloudSetupModal() {
        const rawCfg = localStorage.getItem(CLOUD_CFG_KEY);
        if (rawCfg) {
            try {
                const parsed = JSON.parse(rawCfg);
                document.getElementById('firebaseConfigInput').value = JSON.stringify(parsed.config, null, 2);
                document.getElementById('cloudWorkspaceId').value = parsed.workspaceId || 'dvs-immunoassay-main';
            } catch (e) {}
        }
        document.getElementById('cloudSetupModal').style.display = 'flex';
    }

    function closeCloudSetupModal() {
        document.getElementById('cloudSetupModal').style.display = 'none';
    }

    function saveCloudConfig(e) {
        e.preventDefault();
        let rawText = document.getElementById('firebaseConfigInput').value.trim();
        const workspaceId = document.getElementById('cloudWorkspaceId').value.trim() || 'dvs-immunoassay-main';
        try {
            // Benarkan pengguna menampal sama ada JSON tulen atau blok JS const firebaseConfig = {...};
            const firstBrace = rawText.indexOf('{');
            const lastBrace = rawText.lastIndexOf('}');
            if (firstBrace !== -1 && lastBrace !== -1) {
                rawText = rawText.slice(firstBrace, lastBrace + 1);
            }
            // Tukar kunci objek JS tanpa petikan kepada JSON sah jika perlu
            const normalizedJson = rawText.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":');
            const cfgObj = JSON.parse(normalizedJson);
            if (!cfgObj.apiKey || !cfgObj.projectId) throw new Error('Medan apiKey atau projectId tidak ditemui.');

            localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify({ config: cfgObj, workspaceId }));
            closeCloudSetupModal();
            showToast('Konfigurasi Online disimpan! Sila log masuk akaun pegawai anda.', 'info');
            initCloudEngine();
            openCloudAuthModal();
        } catch (err) {
            showToast('Format konfigurasi tidak sah: ' + err.message, 'error');
        }
    }

    function disconnectCloudConfig() {
        if (cloudUnsubscribe) { cloudUnsubscribe(); cloudUnsubscribe = null; }
        localStorage.removeItem(CLOUD_CFG_KEY);
        currentCloudUser = null;
        closeCloudSetupModal();
        initCloudEngine();
        showToast('Sistem ditukar semula ke Mod Offline (Lokal).', 'info');
    }

    function openCloudAuthModal() {
        document.getElementById('cloudAuthModal').style.display = 'flex';
    }

    function closeCloudAuthModal() {
        document.getElementById('cloudAuthModal').style.display = 'none';
    }

    function submitCloudLogin(e) {
        e.preventDefault();
        if (!cloudAuth) {
            showToast('Sila tetapkan konfigurasi Cloud terlebih dahulu.', 'error');
            return;
        }
        const email = document.getElementById('cloudAuthEmail').value.trim();
        const pass = document.getElementById('cloudAuthPassword').value;
        cloudAuth.signInWithEmailAndPassword(email, pass)
            .then(() => {
                closeCloudAuthModal();
                showToast('Berjaya log masuk! Data kini disegerakkan secara automatik.');
            })
            .catch(err => {
                showToast('Gagal log masuk: ' + err.message, 'error');
            });
    }

    function cloudSignOut() {
        if (cloudAuth) {
            cloudAuth.signOut().then(() => {
                closeCloudAuthModal();
                showToast('Anda telah log keluar dari sesi Online.', 'info');
            });
        }
    }

    function refreshAllViews() {
        populateDropdowns();
        renderDashboard();
        renderInventoryTable();
        calculateElisaPreview();
        renderSavedRecipesDropdown();
        renderReagentMixHistory();
        renderReports();
        if (isAdminUnlocked) renderAdminLists();
    }
// ... existing code ...
        const mixContainer = document.getElementById('mixComponentsContainer');
        if (mixContainer && mixContainer.children.length === 0) {
            addMixComponentRow();
        }
        initCloudEngine();
    }

    window.addEventListener('DOMContentLoaded', initApp);
